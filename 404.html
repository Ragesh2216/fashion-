<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - STACKLY fashion store</title>
    <!-- Google Fonts: Plus Jakarta Sans and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #5EBA9B;
            --primary-light: #C6ECD9;
            --primary-dark: #163A5F;
            --bg-mint: #FAF9F6;
            
            --text-heading: #163A5F;
            --text-body: #555555;
            
            --font-heading: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-body: 'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif;
            
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(94, 186, 155, 0.25);
            --glass-glow: 0 25px 60px rgba(94, 186, 155, 0.12), 0 5px 15px rgba(0, 0, 0, 0.02);
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: radial-gradient(120% 120% at 50% 10%, #ffffff 40%, var(--bg-mint) 100%);
            color: var(--text-heading);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            overflow-y: auto;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(94, 186, 155, 0.12) 1.5px, transparent 0);
            background-size: 32px 32px;
            z-index: -3;
            pointer-events: none;
        }

        /* Ambient floating background blobs */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -2;
            pointer-events: none;
        }

        .bg-blob-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(250, 249, 246, 0.7) 0%, rgba(198, 236, 217, 0.1) 70%);
            top: -10%;
            left: -10%;
            animation: float-blob 18s infinite alternate ease-in-out;
        }

        .bg-blob-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(198, 236, 217, 0.2) 0%, rgba(94, 186, 155, 0.05) 70%);
            bottom: -15%;
            right: -10%;
            animation: float-blob 22s infinite alternate-reverse ease-in-out;
        }

        @keyframes float-blob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.15); }
        }

        .container {
            text-align: center;
            max-width: 620px;
            width: 100%;
            padding: 55px 45px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--glass-border);
            border-radius: 36px;
            box-shadow: var(--glass-glow);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
            transition: var(--transition-smooth);
        }

        .container:hover {
            transform: translateY(-5px);
            border-color: rgba(94, 186, 155, 0.45);
            box-shadow: 0 30px 70px rgba(94, 186, 155, 0.16), 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            display: inline-block;
            margin-bottom: 30px;
            transition: var(--transition-smooth);
        }

        .logo-wrap:hover {
            transform: scale(1.05);
        }

        .logo-img {
            height: 55px;
            width: auto;
            display: block;
        }

        .error-visual {
            margin-bottom: 35px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 180px;
        }

        .flask-svg {
            width: 170px;
            height: 170px;
            filter: drop-shadow(0 15px 25px rgba(94, 186, 155, 0.2));
            animation: float 4s ease-in-out infinite;
            z-index: 2;
        }

        .visual-glow-ring {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(94, 186, 155, 0.18) 0%, rgba(94, 186, 155, 0) 70%);
            animation: pulse-ring 4s infinite ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0.85); opacity: 0.5; }
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* SVG Heart & ECG animations */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1.01); }
            42% { transform: scale(1.13); }
            70% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        @keyframes heartbeat-glow {
            0% { transform: scale(1); opacity: 0.15; }
            14% { transform: scale(1.08); opacity: 0.35; }
            28% { transform: scale(1.01); opacity: 0.2; }
            42% { transform: scale(1.13); opacity: 0.45; }
            70% { transform: scale(1); opacity: 0.15; }
            100% { transform: scale(1); opacity: 0.15; }
        }

        .pulse-heart {
            transform-origin: 60px 59px;
            animation: heartbeat 2s infinite cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: drop-shadow(0 0 4px rgba(94, 186, 155, 0.35));
        }

        .glow-heart {
            transform-origin: 60px 59px;
            animation: heartbeat-glow 2s infinite cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes ecg-sweep {
            0% { stroke-dashoffset: 190; }
            100% { stroke-dashoffset: -190; }
        }

        .ecg-line {
            stroke-dasharray: 45 150;
            animation: ecg-sweep 2.2s infinite linear;
            filter: drop-shadow(0 0 3px var(--primary-dark));
        }

        @keyframes spark {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        .cross-1 {
            animation: spark 3s infinite ease-in-out;
            transform-origin: 25px 15px;
        }

        .cross-2 {
            animation: spark 3.5s infinite ease-in-out 1s;
            transform-origin: 99px 82px;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 220px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0;
            opacity: 0.16;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            user-select: none;
            letter-spacing: -0.05em;
            text-shadow: 0 10px 40px rgba(94, 186, 155, 0.25);
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--primary-dark);
            letter-spacing: -0.02em;
        }

        .error-message {
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-body);
            margin-bottom: 35px;
            font-weight: 500;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            padding: 15px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-smooth);
            border: 1.5px solid transparent;
            box-shadow: 0 8px 22px rgba(43, 102, 63, 0.25);
            cursor: pointer;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(94, 186, 155, 0.35);
        }

        .btn-primary svg {
            transition: transform 0.3s ease;
        }

        .btn-primary:hover svg {
            transform: translateX(-4px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: var(--primary-dark);
            padding: 15px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-smooth);
            border: 1.5px solid rgba(94, 186, 155, 0.45);
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: rgba(94, 186, 155, 0.08);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(94, 186, 155, 0.15);
        }

        .btn-secondary svg {
            transition: transform 0.3s ease;
        }

        .btn-secondary:hover svg {
            transform: translateX(4px);
        }

        /* Email capture styling */
        #email-capture {
            margin-top: 30px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .email-capture-title {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--primary-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .email-capture-field {
            padding: 12px 18px;
            border: 1.5px solid rgba(94, 186, 155, 0.3);
            border-radius: 100px;
            width: 100%;
            max-width: 360px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.8);
            text-align: center;
            color: var(--primary-dark);
            font-weight: 600;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            font-family: var(--font-body);
        }

        /* Responsive styling */
        @media (max-width: 580px) {
            .container {
                padding: 40px 24px;
                width: 95%;
            }
            .logo-img {
                height: 44px;
            }
            .error-visual {
                height: 140px;
                margin-bottom: 25px;
            }
            .flask-svg {
                width: 130px;
                height: 130px;
            }
            .visual-glow-ring {
                width: 110px;
                height: 110px;
            }
            .error-code {
                font-size: 150px;
            }
            .error-title {
                font-size: 26px;
            }
            .error-message {
                font-size: 15px;
                margin-bottom: 25px;
            }
            .btn-group {
                flex-direction: column;
                gap: 12px;
            }
            .btn-primary, .btn-secondary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Background Ambient Elements -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <div class="container">
        <!-- Logo Header -->
        <a href="index.html" class="logo-wrap">
            <img src="assets/home/stackly-logo.webp" alt="STACKLY Logo" class="logo-img">
        </a>

        <!-- Visual Core -->
        <div class="error-visual">
            <div class="visual-glow-ring"></div>
            <h1 class="error-code">404</h1>
            
            <!-- Modern Fashion Hanger & Dress Silhouette SVG -->
            <svg class="flask-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Hanger Hook -->
                <path d="M60 35 C60 25, 70 25, 70 18 C70 12, 60 12, 60 18" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" />
                <!-- Hanger Triangle Body -->
                <path d="M25 45 L60 35 L95 45 Z" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
                <line x1="25" y1="45" x2="95" y2="45" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" />
                
                <!-- Dress outline hanging -->
                <path d="M40 45 L30 100 L90 100 L80 45 Z" fill="var(--primary)" opacity="0.12" />
                <path d="M40 45 L35 60 L28 100 L92 100 L85 60 L80 45 Z" stroke="var(--primary-dark)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
                
                <!-- Belt/Ribbon detail -->
                <line x1="33" y1="65" x2="87" y2="65" stroke="var(--primary)" stroke-width="2.5" />
                
                <!-- Floating Sparkles -->
                <path class="floating-cross cross-1" d="M20 20 H26 M23 17 V23" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" />
                <path class="floating-cross cross-2" d="M100 70 H106 M103 67 V73" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" />
            </svg>
        </div>

        <h2 class="error-title">Out of Style: Page Not Found</h2>
        <p class="error-message">
            The garment, collection, or styling page you are looking for is currently off-season, has been relocated, or is no longer in our design catalog. Let's get you back on track.
        </p>

        <!-- Buttons group -->
        <div class="btn-group">
            <a href="index.html" class="btn-primary">
                <!-- Back Arrow SVG -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>
                Back to Home Base
            </a>

            <button onclick="window.history.back()" class="btn-secondary">
                <!-- Back arrow mirror / Forward arrow styling pointing right -->
                Back to Previous Page
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                    <path d="M12 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Query parameter email capture -->
        <div id="email-capture" style="display:none;">
            <div class="email-capture-title">Subscribed client Email</div>
            <input id="emailField" class="email-capture-field" type="email" readonly>
        </div>
    </div>

    <script>
        (function () {
            var p = new URLSearchParams(location.search);
            var e = p.get('email');
            if (e) {
                var box = document.getElementById('email-capture');
                var field = document.getElementById('emailField');
                field.value = e;
                box.style.display = 'block';
            }
        })();
    </script>
</body>

</html>
